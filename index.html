<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador Precios - José</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #1a252f;
            --primary: #2c3e50;
            --accent: #27ae60;
            --accent-hover: #219150;
            --danger: #e74c3c;
            --border: #cbd5e1;
            --shadow: 0 4px 15px rgba(0,0,0,0.08);
            --c-mercadona: #009944;
            --c-lidl: #0050aa;
            --c-aldi: #00b6ed;
            --c-caprabo: #e30613;
            --c-custom: #8e44ad;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 12px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 650px; background: var(--card-bg); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; border: 2px solid var(--border); margin-bottom: 30px; }
        header { text-align: center; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 2px dashed var(--border); }
        h1 { font-size: 28px; color: var(--primary); }
        .tabs { display: flex; gap: 8px; margin-bottom: 22px; }
        .tab-btn { flex: 1; padding: 14px 8px; border: 2px solid var(--border); background: #edf2f7; color: var(--primary); border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; text-align: center; transition: all 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .section { display: none; }
        .section.active { display: block; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 17px; font-weight: 700; margin-bottom: 8px; color: var(--primary); }
        input[type="text"], input[type="number"] { width: 100%; padding: 14px; font-size: 18px; border: 2px solid var(--border); border-radius: 12px; outline: none; background: #fff; }
        input:focus { border-color: var(--accent); }
        .store-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .store-option { padding: 14px; border: 2px solid var(--border); border-radius: 12px; font-size: 18px; font-weight: 800; text-align: center; cursor: pointer; background: #f8fafc; transition: all 0.15s; }
        .store-option.full-row { grid-column: 1 / -1; }
        .store-option.selected[data-store="Mercadona"] { background: var(--c-mercadona); color: white; border-color: var(--c-mercadona); }
        .store-option.selected[data-store="Lidl"] { background: var(--c-lidl); color: white; border-color: var(--c-lidl); }
        .store-option.selected[data-store="Aldi"] { background: var(--c-aldi); color: white; border-color: var(--c-aldi); }
        .store-option.selected[data-store="Caprabo"] { background: var(--c-caprabo); color: white; border-color: var(--c-caprabo); }
        .store-option.selected[data-store="Otra"] { background: var(--c-custom); color: white; border-color: var(--c-custom); }
        .custom-store-box { margin-top: 10px; display: none; gap: 8px; align-items: center; }
        .btn-clear-input { background: #e2e8f0; border: none; border-radius: 12px; padding: 14px 16px; font-size: 18px; font-weight: 800; color: var(--primary); cursor: pointer; flex-shrink: 0; }
        .btn-main { width: 100%; padding: 16px; background: var(--accent); color: white; border: none; border-radius: 12px; font-size: 20px; font-weight: 800; cursor: pointer; margin-top: 8px; }
        .btn-main:hover { background: var(--accent-hover); }
        .feedback-box { margin-top: 16px; padding: 14px; border-radius: 12px; font-size: 17px; font-weight: 700; text-align: center; display: none; }
        .feedback-good { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .feedback-warn { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .comp-card { background: #fafbfc; border: 1px solid var(--border); border-left: 7px solid var(--primary); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .comp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #e2e8f0; }
        .comp-title { font-size: 21px; font-weight: 800; color: var(--primary); }
        .btn-add-list-mini { background: var(--primary); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
        .price-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; font-size: 18px; background: #fff; border: 1px solid #e2e8f0; gap: 8px; }
        .price-row.cheapest { background: #e8f8f0; border: 2px solid var(--accent); font-weight: 800; }
        .store-badge { padding: 4px 10px; border-radius: 6px; color: white; font-size: 15px; font-weight: 800; display: inline-block; }
        .bg-Mercadona { background: var(--c-mercadona); }
        .bg-Lidl { background: var(--c-lidl); }
        .bg-Aldi { background: var(--c-aldi); }
        .bg-Caprabo { background: var(--c-caprabo); }
        .bg-Custom { background: var(--c-custom); }
        .price-meta { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .date-tag { font-size: 12px; color: #64748b; font-weight: normal; }
        .btn-icon-tiny { background: none; border: none; color: #64748b; font-size: 18px; cursor: pointer; padding: 2px 4px; }
        .btn-icon-tiny:hover { color: var(--primary); }
        .btn-del-tiny { background: none; border: none; color: #94a3b8; font-size: 22px; cursor: pointer; padding: 0 4px; line-height: 1; }
        .btn-del-tiny:hover { color: var(--danger); }
        .list-add-bar { display: flex; gap: 8px; margin-bottom: 15px; }
        .filter-pills { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
        .pill { padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border); background: #edf2f7; font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap; }
        .pill.active { background: var(--primary); color: white; border-color: var(--primary); }
        .store-group-title { font-size: 19px; font-weight: 800; padding: 10px 14px; border-radius: 10px; color: white; margin: 18px 0 10px 0; display: flex; justify-content: space-between; }
        .bg-SinAsignar { background: #64748b; }
        .shop-item { display: flex; align-items: center; padding: 14px; background: #fafbfc; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; font-size: 19px; cursor: pointer; }
        .shop-item.done { opacity: 0.55; text-decoration: line-through; }
        .check-box { width: 24px; height: 24px; border: 2px solid var(--primary); border-radius: 6px; margin-right: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .shop-item.done .check-box { background: var(--primary); color: white; }
        .shop-item.done .check-box::after { content: "✓"; font-weight: bold; }
        .shop-info { flex: 1; }
        .shop-price-tag { font-weight: 800; color: var(--accent); margin-right: 10px; font-size: 18px; }
        .total-banner { background: #edf2f7; padding: 16px; border-radius: 12px; margin-top: 20px; color: var(--primary); }
        .total-main-row { display: flex; justify-content: space-between; align-items: center; font-size: 21px; font-weight: 800; }
        .savings-box { margin-top: 12px; padding-top: 10px; border-top: 1px solid #cbd5e1; font-size: 14px; color: var(--primary); display: none; }
        .savings-header { font-weight: 700; color: #15803d; margin-bottom: 6px; font-size: 15px; }
        .savings-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #e2e8f0; }
        .savings-row:last-child { border-bottom: none; }
        .savings-diff { font-weight: 800; color: #15803d; }
        .btn-clear { width: 100%; margin-top: 12px; padding: 14px; background: #fff; color: var(--danger); border: 2px solid var(--danger); border-radius: 12px; font-size: 17px; font-weight: 800; cursor: pointer; }
        .backup-box { margin-top: 30px; padding-top: 15px; border-top: 2px dashed var(--border); display: flex; flex-direction: column; gap: 10px; }
        .backup-row { display: flex; gap: 10px; }
        .btn-sec { flex: 1; padding: 12px 10px; background: #e2e8f0; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; color: var(--primary); cursor: pointer; text-align: center; }
        .btn-import-tsv { width: 100%; padding: 13px; background: #dbeafe; border: 2px solid #93c5fd; border-radius: 10px; font-size: 16px; font-weight: 800; color: #1e40af; cursor: pointer; }
        .format-hint { font-size: 13px; color: #64748b; text-align: center; margin-top: 2px; }
        .empty-msg { text-align: center; color: #64748b; padding: 30px 10px; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏷️ Comparador Precios</h1>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('anotar')">📝 Anotar</button>
        <button class="tab-btn" onclick="switchTab('comparar')">📊 Precios</button>
        <button class="tab-btn" onclick="switchTab('lista')">🛒 Lista (<span id="listCount">0</span>)</button>
    </div>

    <div id="sec-anotar" class="section active">
        <div class="form-group">
            <label for="prodName">Producto (ej. Atún al natural, Crema calabaza)</label>
            <input type="text" id="prodName" list="existingProducts" placeholder="Escribe el producto...">
            <datalist id="existingProducts"></datalist>
        </div>

        <div class="form-group">
            <label>Supermercado / Tienda</label>
            <div class="store-grid">
                <div class="store-option selected" data-store="Mercadona" onclick="selectStore('Mercadona')">Mercadona</div>
                <div class="store-option" data-store="Lidl" onclick="selectStore('Lidl')">Lidl</div>
                <div class="store-option" data-store="Aldi" onclick="selectStore('Aldi')">Aldi</div>
                <div class="store-option" data-store="Caprabo" onclick="selectStore('Caprabo')">Caprabo</div>
                <div class="store-option full-row" data-store="Otra" onclick="selectStore('Otra')">🏪 Otra tienda (manual)</div>
            </div>
            <div id="customStoreBox" class="custom-store-box">
                <input type="text" id="customStoreName" list="existingStores" placeholder="Nombre de la tienda (ej. Frutería, Bonpreu...)">
                <button type="button" class="btn-clear-input" onclick="clearCustomStore()" title="Limpiar tienda">×</button>
                <datalist id="existingStores"></datalist>
            </div>
        </div>

        <div class="form-group">
            <label for="prodPrice">Precio (€)</label>
            <input type="number" id="prodPrice" step="0.01" inputmode="decimal" placeholder="Ej. 2.45">
        </div>

        <button class="btn-main" onclick="savePrice()">💾 Guardar Precio</button>
        <div id="feedbackBox" class="feedback-box"></div>
    </div>

    <div id="sec-comparar" class="section">
        <div class="form-group">
            <input type="text" id="searchComp" placeholder="🔍 Buscar producto guardado..." oninput="renderComparator()">
        </div>

        <div id="comparatorContainer"></div>

        <div class="backup-box">
            <input type="file" id="tsvFileInput" accept=".txt,.tsv,.csv" style="display: none;" onchange="handleTSVUpload(event)">
            <button class="btn-import-tsv" onclick="document.getElementById('tsvFileInput').click()">📂 Importar TXT (Tabuladores)</button>
            <div class="format-hint">Formato por línea: Producto [TAB] Tienda [TAB] Precio</div>
            
            <div class="backup-row" style="margin-top: 6px;">
                <button class="btn-sec" onclick="exportData()">📤 Copiar Backup</button>
                <button class="btn-sec" onclick="importData()">📥 Restaurar Backup</button>
            </div>
        </div>
    </div>

    <div id="sec-lista" class="section">
        <div class="list-add-bar">
            <input type="text" id="listInput" list="existingProducts" placeholder="Añadir a la lista..." onkeypress="if(event.key==='Enter') addToShoppingList()">
            <button class="btn-main" style="width: auto; margin-top: 0; padding: 0 20px;" onclick="addToShoppingList()">+</button>
        </div>

        <div class="filter-pills" id="storeFilters"></div>

        <div id="shoppingListContainer"></div>

        <div class="total-banner">
            <div class="total-main-row">
                <span>Total estimado:</span>
                <span id="totalEstimated">0,00 €</span>
            </div>
            <div id="savingsBox" class="savings-box"></div>
        </div>

        <button class="btn-clear" onclick="clearDoneItems()">🗑️ Borrar productos tachados</button>
    </div>
</div>

<script>
    const DEFAULT_STORES = ['Mercadona', 'Lidl', 'Aldi', 'Caprabo'];
    let preciosDB = JSON.parse(localStorage.getItem('jose_super_precios')) || {};
    let shoppingList = JSON.parse(localStorage.getItem('jose_super_lista')) || [];
    let selectedStore = 'Mercadona';
    let currentFilter = 'Todos';

    function saveData() {
        localStorage.setItem('jose_super_precios', JSON.stringify(preciosDB));
        localStorage.setItem('jose_super_lista', JSON.stringify(shoppingList));
        updateDatalists();
        updateListCount();
    }

    function normalizeKey(str) {
        return str.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function formatStoreName(rawStore) {
        const clean = rawStore.trim();
        if (!clean) return null;
        const low = normalizeKey(clean);
        if (low === 'mercadona') return 'Mercadona';
        if (low === 'lidl') return 'Lidl';
        if (low === 'aldi') return 'Aldi';
        if (low === 'caprabo') return 'Caprabo';
        return clean.charAt(0).toUpperCase() + clean.slice(1);
    }

    function getStoreBgClass(store) {
        if (DEFAULT_STORES.includes(store)) return `bg-${store}`;
        if (store === 'Sin asignar') return 'bg-SinAsignar';
        return 'bg-Custom';
    }

    function getAllKnownStores() {
        const customSet = new Set();
        Object.values(preciosDB).forEach(prod => {
            Object.keys(prod.prices).forEach(st => {
                if (!DEFAULT_STORES.includes(st)) customSet.add(st);
            });
        });
        return [...DEFAULT_STORES, ...Array.from(customSet).sort()];
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));

        if (tab === 'anotar') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('sec-anotar').classList.add('active');
        } else if (tab === 'comparar') {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('sec-comparar').classList.add('active');
            renderComparator();
        } else {
            document.querySelectorAll('.tab-btn')[2].classList.add('active');
            document.getElementById('sec-lista').classList.add('active');
            renderFilterPills();
            renderShoppingList();
        }
    }

    function selectStore(store) {
        selectedStore = store;
        document.querySelectorAll('.store-option').forEach(el => {
            el.classList.toggle('selected', el.dataset.store === store);
        });
        const customBox = document.getElementById('customStoreBox');
        if (store === 'Otra') {
            customBox.style.display = 'flex';
            const input = document.getElementById('customStoreName');
            input.value = '';
            input.focus();
        } else {
            customBox.style.display = 'none';
        }
    }

    function clearCustomStore() {
        const input = document.getElementById('customStoreName');
        input.value = '';
        input.focus();
    }

    function savePrice() {
        const rawName = document.getElementById('prodName').value.trim();
        const priceVal = parseFloat(document.getElementById('prodPrice').value);

        let finalStore = selectedStore;
        if (selectedStore === 'Otra') {
            const customInput = document.getElementById('customStoreName').value.trim();
            if (!customInput) {
                alert('Por favor, escribe el nombre de la tienda.');
                return;
            }
            finalStore = formatStoreName(customInput);
        }

        if (!rawName || isNaN(priceVal) || priceVal <= 0) {
            alert('Por favor, escribe el nombre del producto y un precio válido.');
            return;
        }

        const key = normalizeKey(rawName);
        const todayStr = new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });

        let prevBest = null;
        if (preciosDB[key]) {
            const entries = Object.entries(preciosDB[key].prices);
            if (entries.length > 0) {
                entries.sort((a, b) => a[1].price - b[1].price);
                prevBest = { store: entries[0][0], price: entries[0][1].price };
            }
        } else {
            preciosDB[key] = { displayName: rawName, prices: {} };
        }

        preciosDB[key].displayName = rawName;
        preciosDB[key].prices[finalStore] = { price: priceVal, date: todayStr };
        saveData();

        const fb = document.getElementById('feedbackBox');
        fb.style.display = 'block';

        if (!prevBest) {
            fb.className = 'feedback-box feedback-good';
            fb.textContent = `✅ Guardado: ${rawName} a ${priceVal.toFixed(2)} € en ${finalStore}.`;
        } else if (priceVal < prevBest.price) {
            const diff = (prevBest.price - priceVal).toFixed(2);
            fb.className = 'feedback-box feedback-good';
            fb.textContent = `🏆 ¡Nuevo mejor precio! Ahorras ${diff} € respecto a ${prevBest.store} (${prevBest.price.toFixed(2)} €).`;
        } else if (priceVal > prevBest.price && prevBest.store !== finalStore) {
            const diff = (priceVal - prevBest.price).toFixed(2);
            fb.className = 'feedback-box feedback-warn';
            fb.textContent = `⚠️ Guardado, pero en ${prevBest.store} lo tienes ${diff} € más barato (${prevBest.price.toFixed(2)} €).`;
        } else {
            fb.className = 'feedback-box feedback-good';
            fb.textContent = `✅ Precio actualizado en ${finalStore}: ${priceVal.toFixed(2)} €.`;
        }

        document.getElementById('prodName').value = '';
        document.getElementById('prodPrice').value = '';
        if (selectedStore === 'Otra') {
            document.getElementById('customStoreName').value = '';
        }
    }

    function handleTSVUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const text = e.target.result;
            const lines = text.split(/\r?\n/);
            const todayStr = new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });
            let importedCount = 0;
            let skippedLines = [];

            lines.forEach((line, index) => {
                if (!line.trim()) return;
                const parts = line.split('\t');
                if (parts.length < 3) {
                    skippedLines.push(`Línea ${index + 1}: faltan columnas`);
                    return;
                }

                const rawProd = parts[0].trim();
                const validStore = formatStoreName(parts[1]);
                const rawPrice = parts[2].trim().replace('€', '').replace(',', '.').trim();
                const priceVal = parseFloat(rawPrice);

                if (index === 0 && isNaN(priceVal)) return;

                if (!rawProd || !validStore || isNaN(priceVal) || priceVal <= 0) {
                    skippedLines.push(`Línea ${index + 1} (${rawProd || 'sin nombre'}): tienda o precio no válido`);
                    return;
                }

                const key = normalizeKey(rawProd);
                if (!preciosDB[key]) {
                    preciosDB[key] = { displayName: rawProd, prices: {} };
                } else {
                    preciosDB[key].displayName = rawProd;
                }

                preciosDB[key].prices[validStore] = { price: priceVal, date: todayStr };
                importedCount++;
            });

            saveData();
            renderComparator();
            event.target.value = '';

            let msg = `✅ Se han actualizado/añadido ${importedCount} precios correctamente.`;
            if (skippedLines.length > 0) {
                msg += `\n\n⚠️ Líneas ignoradas (${skippedLines.length}):\n` + skippedLines.slice(0, 5).join('\n');
            }
            alert(msg);
        };

        reader.readAsText(file, 'UTF-8');
    }

    function updateDatalists() {
        const dlProd = document.getElementById('existingProducts');
        dlProd.innerHTML = '';
        Object.values(preciosDB).forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.displayName;
            dlProd.appendChild(opt);
        });

        const dlStores = document.getElementById('existingStores');
        dlStores.innerHTML = '';
        getAllKnownStores().forEach(st => {
            if (!DEFAULT_STORES.includes(st)) {
                const opt = document.createElement('option');
                opt.value = st;
                dlStores.appendChild(opt);
            }
        });
    }

    function renderComparator() {
        const container = document.getElementById('comparatorContainer');
        const filterText = normalizeKey(document.getElementById('searchComp').value);
        container.innerHTML = '';

        const keys = Object.keys(preciosDB).filter(k => k.includes(filterText)).sort();

        if (keys.length === 0) {
            container.innerHTML = '<div class="empty-msg">No hay productos guardados que coincidan. ¡Empieza anotando precios o importa un archivo TXT!</div>';
            return;
        }

        keys.forEach(key => {
            const prod = preciosDB[key];
            const storeEntries = Object.entries(prod.prices).sort((a, b) => a[1].price - b[1].price);
            if (storeEntries.length === 0) return;

            const card = document.createElement('div');
            card.className = 'comp-card';

            let rowsHtml = '';
            storeEntries.forEach(([store, info], idx) => {
                const isBest = idx === 0;
                const badgeClass = getStoreBgClass(store);
                const safeStore = store.replace(/'/g, "\\'");
                rowsHtml += `
                    <div class="price-row ${isBest ? 'cheapest' : ''}">
                        <div>
                            <span class="store-badge ${badgeClass}">${store}</span>
                            ${isBest && storeEntries.length > 1 ? ' 🏆' : ''}
                        </div>
                        <div class="price-meta">
                            <span class="date-tag">(${info.date})</span>
                            <span>${info.price.toFixed(2)} €</span>
                            <button class="btn-icon-tiny" onclick="editStorePrice('${key}', '${safeStore}')" title="Editar precio">✏️</button>
                            <button class="btn-del-tiny" onclick="deleteStorePrice('${key}', '${safeStore}')" title="Borrar precio">×</button>
                        </div>
                    </div>
                `;
            });

            card.innerHTML = `
                <div class="comp-header">
                    <span class="comp-title">${prod.displayName}</span>
                    <button class="btn-add-list-mini" onclick="quickAddToList('${prod.displayName.replace(/'/g, "\\'")}')">+ Lista</button>
                </div>
                ${rowsHtml}
            `;
            container.appendChild(card);
        });
    }

    function editStorePrice(key, store) {
        if (!preciosDB[key] || !preciosDB[key].prices[store]) return;
        const currentPrice = preciosDB[key].prices[store].price;
        const prodName = preciosDB[key].displayName;

        const input = prompt(`Nuevo precio (€) para "${prodName}" en ${store}:`, currentPrice.toFixed(2));
        if (input === null) return;

        const newPrice = parseFloat(input.replace(',', '.').trim());
        if (isNaN(newPrice) || newPrice <= 0) {
            alert('Por favor, introduce un precio válido mayor que 0.');
            return;
        }

        const todayStr = new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });
        preciosDB[key].prices[store] = { price: newPrice, date: todayStr };
        saveData();
        renderComparator();
    }

    function deleteStorePrice(key, store) {
        if (confirm(`¿Borrar el precio de ${store} para este producto?`)) {
            delete preciosDB[key].prices[store];
            if (Object.keys(preciosDB[key].prices).length === 0) {
                delete preciosDB[key];
            }
            saveData();
            renderComparator();
        }
    }

    function quickAddToList(name) {
        shoppingList.unshift({ id: Date.now().toString(), name: name, done: false });
        saveData();
        alert(`"${name}" añadido a tu lista de la compra.`);
    }

    function addToShoppingList() {
        const input = document.getElementById('listInput');
        const val = input.value.trim();
        if (!val) return;

        shoppingList.unshift({ id: Date.now().toString(), name: val, done: false });
        input.value = '';
        saveData();
        renderShoppingList();
    }

    function renderFilterPills() {
        const container = document.getElementById('storeFilters');
        const stores = ['Todos', ...getAllKnownStores()];
        if (!stores.includes(currentFilter)) currentFilter = 'Todos';

        container.innerHTML = '';
        stores.forEach(st => {
            const btn = document.createElement('button');
            btn.className = 'pill' + (currentFilter === st ? ' active' : '');
            btn.textContent = st;
            btn.onclick = () => setFilter(st);
            container.appendChild(btn);
        });
    }

    function setFilter(store) {
        currentFilter = store;
        renderFilterPills();
        renderShoppingList();
    }

    function getBestOptionForProduct(name) {
        const key = normalizeKey(name);
        if (!preciosDB[key]) return { store: 'Sin asignar', price: null };
        const entries = Object.entries(preciosDB[key].prices).sort((a, b) => a[1].price - b[1].price);
        if (entries.length === 0) return { store: 'Sin asignar', price: null };
        return { store: entries[0][0], price: entries[0][1].price };
    }

    function buildRepeatedProductsComparison() {
        // Filtramos únicamente los productos de la lista que tienen precios en 2 o más tiendas
        const comparableItems = [];
        shoppingList.forEach(item => {
            const key = normalizeKey(item.name);
            if (preciosDB[key]) {
                const entries = Object.entries(preciosDB[key].prices);
                if (entries.length >= 2) {
                    entries.sort((a, b) => a[1].price - b[1].price);
                    comparableItems.push({
                        name: item.name,
                        bestPrice: entries[0][1].price,
                        bestStore: entries[0][0],
                        worstPrice: entries[entries.length - 1][1].price,
                        pricesMap: preciosDB[key].prices
                    });
                }
            }
        });

        if (comparableItems.length === 0) return null;

        const optimizedComparableTotal = comparableItems.reduce((acc, it) => acc + it.bestPrice, 0);
        const worstComparableTotal = comparableItems.reduce((acc, it) => acc + it.worstPrice, 0);
        const maxSavings = worstComparableTotal - optimizedComparableTotal;

        // Calculamos cuánto costarían esos productos comparables en cada tienda donde estén registrados
        const storeBreakdown = [];
        getAllKnownStores().forEach(store => {
            let storeSum = 0;
            let bestSumForThose = 0;
            let countInStore = 0;

            comparableItems.forEach(it => {
                if (it.pricesMap[store]) {
                    storeSum += it.pricesMap[store].price;
                    bestSumForThose += it.bestPrice;
                    countInStore++;
                }
            });

            if (countInStore > 0) {
                storeBreakdown.push({
                    store: store,
                    count: countInStore,
                    storeTotal: storeSum,
                    savedVsStore: storeSum - bestSumForThose
                });
            }
        });

        // Ordenamos de mayor ahorro a menor ahorro
        storeBreakdown.sort((a, b) => b.savedVsStore - a.savedVsStore);

        return {
            count: comparableItems.length,
            optimizedTotal: optimizedComparableTotal,
            maxSavings: maxSavings,
            storeBreakdown: storeBreakdown
        };
    }

    function renderShoppingList() {
        const container = document.getElementById('shoppingListContainer');
        const savingsBox = document.getElementById('savingsBox');
        container.innerHTML = '';
        savingsBox.style.display = 'none';

        if (shoppingList.length === 0) {
            container.innerHTML = '<div class="empty-msg">Tu lista está vacía. Añade productos arriba o desde el comparador.</div>';
            document.getElementById('totalEstimated').textContent = '0,00 €';
            return;
        }

        const storesOrder = [...getAllKnownStores(), 'Sin asignar'];
        const groups = {};
        storesOrder.forEach(s => groups[s] = []);

        let grandTotal = 0;

        shoppingList.forEach(item => {
            const best = getBestOptionForProduct(item.name);
            if (!groups[best.store]) groups[best.store] = [];
            groups[best.store].push({ ...item, bestPrice: best.price, bestStore: best.store });
            if (best.price !== null && (currentFilter === 'Todos' || currentFilter === best.store)) {
                grandTotal += best.price;
            }
        });

        storesOrder.forEach(storeName => {
            if (currentFilter !== 'Todos' && currentFilter !== storeName) return;
            const itemsInStore = groups[storeName];
            if (!itemsInStore || itemsInStore.length === 0) return;

            itemsInStore.sort((a, b) => a.done - b.done);

            let subtotal = 0;
            itemsInStore.forEach(i => { if (i.bestPrice) subtotal += i.bestPrice; });

            const header = document.createElement('div');
            const bgClass = getStoreBgClass(storeName);
            header.className = `store-group-title ${bgClass}`;
            header.innerHTML = `
                <span>${storeName === 'Sin asignar' ? '❓ Sin precio registrado' : '🏪 ' + storeName}</span>
                <span>${subtotal > 0 ? subtotal.toFixed(2) + ' €' : ''}</span>
            `;
            container.appendChild(header);

            itemsInStore.forEach(item => {
                const row = document.createElement('div');
                row.className = `shop-item ${item.done ? 'done' : ''}`;
                row.innerHTML = `
                    <div class="check-box" onclick="toggleShopItem('${item.id}')"></div>
                    <div class="shop-info" onclick="toggleShopItem('${item.id}')">${item.name}</div>
                    ${item.bestPrice !== null ? `<span class="shop-price-tag">${item.bestPrice.toFixed(2)} €</span>` : ''}
                    <button class="btn-del-tiny" onclick="deleteShopItem('${item.id}')">×</button>
                `;
                container.appendChild(row);
            });
        });

        document.getElementById('totalEstimated').textContent = grandTotal.toFixed(2).replace('.', ',') + ' €';

        if (currentFilter === 'Todos') {
            const comp = buildRepeatedProductsComparison();
            if (comp && comp.maxSavings > 0.005) {
                savingsBox.style.display = 'block';
                const optStr = comp.optimizedTotal.toFixed(2).replace('.', ',');
                const maxSaveStr = comp.maxSavings.toFixed(2).replace('.', ',');

                let rowsHtml = `
                    <div class="savings-header">
                        📊 Comparativa en ${comp.count} ${comp.count === 1 ? 'producto repetido' : 'productos repetidos'} (pagas ${optStr} € y ahorras hasta ${maxSaveStr} €):
                    </div>
                `;

                comp.storeBreakdown.forEach(st => {
                    const stTotStr = st.storeTotal.toFixed(2).replace('.', ',');
                    const diffStr = st.savedVsStore.toFixed(2).replace('.', ',');
                    const prodLabel = `${st.count}/${comp.count} prod.`;
                    
                    rowsHtml += `
                        <div class="savings-row">
                            <span>• En <strong>${st.store}</strong> (${prodLabel}): ${stTotStr} €</span>
                            <span class="savings-diff">${st.savedVsStore > 0.005 ? `ahorras ${diffStr} €` : 'mejor precio'}</span>
                        </div>
                    `;
                });

                savingsBox.innerHTML = rowsHtml;
            }
        }
    }

    function toggleShopItem(id) {
        const idx = shoppingList.findIndex(i => i.id === id);
        if (idx > -1) {
            shoppingList[idx].done = !shoppingList[idx].done;
            saveData();
            renderShoppingList();
        }
    }

    function deleteShopItem(id) {
        shoppingList = shoppingList.filter(i => i.id !== id);
        saveData();
        renderShoppingList();
    }

    function clearDoneItems() {
        const remaining = shoppingList.filter(i => !i.done);
        if (remaining.length === shoppingList.length) {
            alert('No hay productos tachados para borrar.');
            return;
        }
        if (confirm('¿Borrar los productos ya tachados de la lista?')) {
            shoppingList = remaining;
            saveData();
            renderShoppingList();
        }
    }

    function updateListCount() {
        const pending = shoppingList.filter(i => !i.done).length;
        document.getElementById('listCount').textContent = pending;
    }

    function exportData() {
        const backup = JSON.stringify({ preciosDB, shoppingList });
        navigator.clipboard.writeText(backup).then(() => {
            alert('✅ Copia de seguridad copiada al portapapeles. Pégala en una nota de tu iPhone para guardarla.');
        }).catch(() => {
            prompt('Copia este texto manualmente para guardar tus datos:', backup);
        });
    }

    function importData() {
        const raw = prompt('Pega aquí el texto de tu copia de seguridad:');
        if (!raw) return;
        try {
            const parsed = JSON.parse(raw);
            if (parsed.preciosDB) {
                preciosDB = parsed.preciosDB;
                shoppingList = parsed.shoppingList || [];
                saveData();
                renderComparator();
                renderFilterPills();
                alert('✅ Datos restaurados correctamente.');
            } else {
                alert('El formato del texto no es válido.');
            }
        } catch (e) {
            alert('Error al leer los datos. Asegúrate de copiar el texto completo.');
        }
    }

    window.onload = () => {
        updateDatalists();
        updateListCount();
        renderFilterPills();
    };
</script>
