<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador Súper - José</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #1a252f;
            --primary: #2c3e50;
            --accent: #27ae60;
            --accent-hover: #219150;
            --danger: #e74c3c;
            --border: #cbd5e1;
            --shadow: 0 4px 15px rgba(0,0,0,0.08);
            --c-mercadona: #009944;
            --c-lidl: #0050aa;
            --c-aldi: #00b6ed;
            --c-caprabo: #e30613;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 12px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 650px; background: var(--card-bg); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; border: 2px solid var(--border); margin-bottom: 30px; }
        header { text-align: center; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 2px dashed var(--border); }
        h1 { font-size: 28px; color: var(--primary); }
        .tabs { display: flex; gap: 8px; margin-bottom: 22px; }
        .tab-btn { flex: 1; padding: 14px 8px; border: 2px solid var(--border); background: #edf2f7; color: var(--primary); border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; text-align: center; transition: all 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .section { display: none; }
        .section.active { display: block; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 17px; font-weight: 700; margin-bottom: 8px; color: var(--primary); }
        input[type="text"], input[type="number"] { width: 100%; padding: 14px; font-size: 18px; border: 2px solid var(--border); border-radius: 12px; outline: none; background: #fff; }
        input:focus { border-color: var(--accent); }
        .store-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .store-option { padding: 14px; border: 2px solid var(--border); border-radius: 12px; font-size: 18px; font-weight: 800; text-align: center; cursor: pointer; background: #f8fafc; transition: all 0.15s; }
        .store-option.selected[data-store="Mercadona"] { background: var(--c-mercadona); color: white; border-color: var(--c-mercadona); }
        .store-option.selected[data-store="Lidl"] { background: var(--c-lidl); color: white; border-color: var(--c-lidl); }
        .store-option.selected[data-store="Aldi"] { background: var(--c-aldi); color: white; border-color: var(--c-aldi); }
        .store-option.selected[data-store="Caprabo"] { background: var(--c-caprabo); color: white; border-color: var(--c-caprabo); }
        .btn-main { width: 100%; padding: 16px; background: var(--accent); color: white; border: none; border-radius: 12px; font-size: 20px; font-weight: 800; cursor: pointer; margin-top: 8px; }
        .btn-main:hover { background: var(--accent-hover); }
        .feedback-box { margin-top: 16px; padding: 14px; border-radius: 12px; font-size: 17px; font-weight: 700; text-align: center; display: none; }
        .feedback-good { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .feedback-warn { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .comp-card { background: #fafbfc; border: 1px solid var(--border); border-left: 7px solid var(--primary); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .comp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #e2e8f0; }
        .comp-title { font-size: 21px; font-weight: 800; color: var(--primary); }
        .btn-add-list-mini { background: var(--primary); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
        .price-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; font-size: 18px; background: #fff; border: 1px solid #e2e8f0; }
        .price-row.cheapest { background: #e8f8f0; border: 2px solid var(--accent); font-weight: 800; }
        .store-badge { padding: 4px 10px; border-radius: 6px; color: white; font-size: 15px; font-weight: 800; }
        .bg-Mercadona { background: var(--c-mercadona); }
        .bg-Lidl { background: var(--c-lidl); }
        .bg-Aldi { background: var(--c-aldi); }
        .bg-Caprabo { background: var(--c-caprabo); }
        .price-meta { display: flex; align-items: center; gap: 10px; }
        .date-tag { font-size: 12px; color: #64748b; font-weight: normal; }
        .btn-del-tiny { background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; padding: 0 4px; }
        .btn-del-tiny:hover { color: var(--danger); }
        .list-add-bar { display: flex; gap: 8px; margin-bottom: 15px; }
        .filter-pills { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
        .pill { padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border); background: #edf2f7; font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap; }
        .pill.active { background: var(--primary); color: white; border-color: var(--primary); }
        .store-group-title { font-size: 19px; font-weight: 800; padding: 10px 14px; border-radius: 10px; color: white; margin: 18px 0 10px 0; display: flex; justify-content: space-between; }
        .bg-SinAsignar { background: #64748b; }
        .shop-item { display: flex; align-items: center; padding: 14px; background: #fafbfc; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; font-size: 19px; cursor: pointer; }
        .shop-item.done { opacity: 0.55; text-decoration: line-through; }
        .check-box { width: 24px; height: 24px; border: 2px solid var(--primary); border-radius: 6px; margin-right: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .shop-item.done .check-box { background: var(--primary); color: white; }
        .shop-item.done .check-box::after { content: "✓"; font-weight: bold; }
        .shop-info { flex: 1; }
        .shop-price-tag { font-weight: 800; color: var(--accent); margin-right: 10px; font-size: 18px; }
        .total-banner { background: #edf2f7; padding: 16px; border-radius: 12px; margin-top: 20px; color: var(--primary); }
        .total-main-row { display: flex; justify-content: space-between; align-items: center; font-size: 21px; font-weight: 800; }
        .savings-note { margin-top: 8px; padding-top: 8px; border-top: 1px solid #cbd5e1; font-size: 14px; font-weight: 600; color: #15803d; line-height: 1.4; display: none; }
        .btn-clear { width: 100%; margin-top: 12px; padding: 14px; background: #fff; color: var(--danger); border: 2px solid var(--danger); border-radius: 12px; font-size: 17px; font-weight: 800; cursor: pointer; }
        .backup-box { margin-top: 30px; padding-top: 15px; border-top: 2px dashed var(--border); display: flex; flex-direction: column; gap: 10px; }
        .backup-row { display: flex; gap: 10px; }
        .btn-sec { flex: 1; padding: 12px 10px; background: #e2e8f0; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; color: var(--primary); cursor: pointer; text-align: center; }
        .btn-import-tsv { width: 100%; padding: 13px; background: #dbeafe; border: 2px solid #93c5fd; border-radius: 10px; font-size: 16px; font-weight: 800; color: #1e40af; cursor: pointer; }
        .format-hint { font-size: 13px; color: #64748b; text-align: center; margin-top: 2px; }
        .empty-msg { text-align: center; color: #64748b; padding: 30px 10px; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏷️ Comparador Súper</h1>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('anotar')">📝 Anotar</button>
        <button class="tab-btn" onclick="switchTab('comparar')">📊 Precios</button>
        <button class="tab-btn" onclick="switchTab('lista')">🛒 Lista (<span id="listCount">0</span>)</button>
    </div>

    <div id="sec-anotar" class="section active">
        <div class="form-group">
            <label for="prodName">Producto (ej. Atún al natural, Crema calabaza)</label>
