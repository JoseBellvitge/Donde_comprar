<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador Precios - José</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #1a252f;
            --primary: #2c3e50;
            --accent: #27ae60;
            --accent-hover: #219150;
            --danger: #e74c3c;
            --border: #cbd5e1;
            --shadow: 0 4px 15px rgba(0,0,0,0.08);
            --c-mercadona: #009944;
            --c-lidl: #0050aa;
            --c-aldi: #00b6ed;
            --c-caprabo: #e30613;
            --c-custom: #8e44ad;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 12px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 650px; background: var(--card-bg); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; border: 2px solid var(--border); margin-bottom: 30px; }
        header { text-align: center; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 2px dashed var(--border); }
        h1 { font-size: 28px; color: var(--primary); }
        .tabs { display: flex; gap: 8px; margin-bottom: 22px; }
        .tab-btn { flex: 1; padding: 14px 8px; border: 2px solid var(--border); background: #edf2f7; color: var(--primary); border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; text-align: center; transition: all 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .section { display: none; }
        .section.active { display: block; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 17px; font-weight: 700; margin-bottom: 8px; color: var(--primary); }
        input[type="text"], input[type="number"], select { width: 100%; padding: 14px; font-size: 18px; border: 2px solid var(--border); border-radius: 12px; outline: none; background: #fff; }
        input:focus, select:focus { border-color: var(--accent); }
        .store-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .store-option { position: relative; padding: 14px 28px; border: 2px solid var(--border); border-radius: 12px; font-size: 18px; font-weight: 800; text-align: center; cursor: pointer; background: #f8fafc; transition: all 0.15s; user-select: none; }
        .store-option.full-row { grid-column: 1 / -1; }
        .store-option.selected[data-store="Mercadona"] { background: var(--c-mercadona); color: white; border-color: var(--c-mercadona); }
        .store-option.selected[data-store="Lidl"] { background: var(--c-lidl); color: white; border-color: var(--c-lidl); }
        .store-option.selected[data-store="Aldi"] { background: var(--c-aldi); color: white; border-color: var(--c-aldi); }
        .store-option.selected[data-store="Caprabo"] { background: var(--c-caprabo); color: white; border-color: var(--c-caprabo); }
        .store-option.selected[data-type="custom"] { background: var(--c-custom); color: white; border-color: var(--c-custom); }
        .store-option.selected[data-store="Otra"] { background: #475569; color: white; border-color: #475569; }
        .btn-remove-store { position: absolute; top: 4px; right: 6px; background: rgba(0,0,0,0.12); color: inherit; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 15px; font-weight: 800; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-remove-store:hover { background: var(--danger); color: white; }
        .custom-store-box { margin-top: 10px; display: none; gap: 8px; align-items: center; }
        .btn-clear-input { background: #e2e8f0; border: none; border-radius: 12px; padding: 14px 16px; font-size: 18px; font-weight: 800; color: var(--primary); cursor: pointer; flex-shrink: 0; }
        .btn-main { width: 100%; padding: 16px; background: var(--accent); color: white; border: none; border-radius: 12px; font-size: 20px; font-weight: 800; cursor: pointer; margin-top: 8px; }
        .btn-main:hover { background: var(--accent-hover); }
        .btn-secondary-add { width: 100%; padding: 13px; background: #edf2f7; color: var(--primary); border: 2px solid var(--border); border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .feedback-box { margin-top: 16px; padding: 14px; border-radius: 12px; font-size: 17px; font-weight: 700; text-align: center; display: none; }
        .feedback-good { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .feedback-warn { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }

        .comp-card {
            background: #ffffff;
            border: 2px solid var(--border);
            border-left: 8px solid var(--primary);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 22px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .comp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background: #eef2f6;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            border-bottom: 2px solid #cbd5e1;
        }
        .comp-title-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 0;
        }
        .comp-title {
            font-size: 19px;
            font-weight: 900;
            color: #0f172a;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            line-height: 1.25;
            word-break: break-word;
        }
        .btn-edit-name {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 4px 7px;
            font-size: 15px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .btn-edit-name:hover {
            border-color: var(--primary);
            background: #f8fafc;
        }
        .btn-add-list-mini {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            flex-shrink: 0;
        }
        .price-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; font-size: 18px; background: #fafbfc; border: 1px solid #e2e8f0; gap: 8px; }
        .price-row:last-child { margin-bottom: 0; }
        .price-row.cheapest { background: #e8f8f0; border: 2px solid var(--accent); font-weight: 800; }
        .store-badge { padding: 4px 10px; border-radius: 6px; color: white; font-size: 15px; font-weight: 800; display: inline-block; }
        .bg-Mercadona { background: var(--c-mercadona); }
        .bg-Lidl { background: var(--c-lidl); }
        .bg-Aldi { background: var(--c-aldi); }
        .bg-Caprabo { background: var(--c-caprabo); }
        .bg-Custom { background: var(--c-custom); }
        .price-meta { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .date-tag { font-size: 12px; color: #64748b; font-weight: normal; }
        .btn-icon-tiny { background: none; border: none; color: #64748b; font-size: 18px; cursor: pointer; padding: 2px 4px; }
        .btn-icon-tiny:hover { color: var(--primary); }
        .btn-del-tiny { background: none; border: none; color: #94a3b8; font-size: 22px; cursor: pointer; padding: 0 4px; line-height: 1; }
        .btn-del-tiny:hover { color: var(--danger); }
        .list-add-bar { display: flex; gap: 8px; margin-bottom: 15px; }
        .filter-pills { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
        .pill { padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border); background: #edf2f7; font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap; }
        .pill.active { background: var(--primary); color: white; border-color: var(--primary); }
        .store-group-title { font-size: 19px; font-weight: 800; padding: 10px 14px; border-radius: 10px; color: white; margin: 18px 0 10px 0; display: flex; justify-content: space-between; }
        .bg-SinAsignar { background: #64748b; }
        .shop-item { display: flex; align-items: center; padding: 12px 14px; background: #fafbfc; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; font-size: 18px; cursor: pointer; gap: 8px; }
        .shop-item.done { opacity: 0.55; text-decoration: line-through; }
        .check-box { width: 24px; height: 24px; border: 2px solid var(--primary); border-radius: 6px; margin-right: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .shop-item.done .check-box { background: var(--primary); color: white; }
        .shop-item.done .check-box::after { content: "✓"; font-weight: bold; }
        .shop-info { flex: 1; font-weight: 700; text-transform: uppercase; word-break: break-word; }
        .shop-price-tag { font-weight: 800; color: var(--accent); font-size: 17px; white-space: nowrap; }
        .btn-set-price { background: #fef3c7; border: 1px solid #f59e0b; color: #92400e; padding: 6px 10px; border-radius: 8px; font-size: 14px; font-weight: 800; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
        .btn-set-price:hover { background: #fde68a; }
        .btn-add-price-plus { background: #e2e8f0; border: none; color: var(--primary); padding: 5px 8px; border-radius: 6px; font-size: 13px; font-weight: 800; cursor: pointer; flex-shrink: 0; }
        .total-banner { background: #edf2f7; padding: 16px; border-radius: 12px; margin-top: 20px; color: var(--primary); }
        .total-main-row { display: flex; justify-content: space-between; align-items: center; font-size: 21px; font-weight: 800; }
        .savings-note { margin-top: 10px; padding-top: 10px; border-top: 1px solid #cbd5e1; font-size: 16px; font-weight: 700; color: #15803d; line-height: 1.4; display: none; }
        .btn-clear { width: 100%; margin-top: 12px; padding: 14px; background: #fff; color: var(--danger); border: 2px solid var(--danger); border-radius: 12px; font-size: 17px; font-weight: 800; cursor: pointer; }
        .backup-box { margin-top: 30px; padding-top: 15px; border-top: 2px dashed var(--border); display: flex; flex-direction: column; gap: 10px; }
        .backup-row { display: flex; gap: 10px; }
        .btn-sec { flex: 1; padding: 12px 10px; background: #e2e8f0; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; color: var(--primary); cursor: pointer; text-align: center; }
        .btn-import-tsv { width: 100%; padding: 13px; background: #dbeafe; border: 2px solid #93c5fd; border-radius: 10px; font-size: 16px; font-weight: 800; color: #1e40af; cursor: pointer; }
        .format-hint { font-size: 13px; color: #64748b; text-align: center; margin-top: 2px; }
        .empty-msg { text-align: center; color: #64748b; padding: 30px 10px; font-size: 18px; }

        /* Modal integrado para poner precio desde la lista sin bloqueos de Safari */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 999;
        }
        .modal-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            border: 2px solid var(--border);
        }
        .modal-title {
            font-size: 20px;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 14px;
            text-transform: uppercase;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .btn-modal-cancel {
            flex: 1;
            padding: 14px;
            background: #e2e8f0;
            color: var(--primary);
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
        }
        .btn-modal-save {
            flex: 1;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏷️ Comparador Precios</h1>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('anotar')">📝 Anotar</button>
        <button class="tab-btn" onclick="switchTab('comparar')">📊 Productos</button>
        <button class="tab-btn" onclick="switchTab('lista')">🛒 Lista (<span id="listCount">0</span>)</button>
    </div>

    <div id="sec-anotar" class="section active">
        <div class="form-group">
            <label for="prodName">Producto (ej. Arándanos, Atún al natural)</label>
            <input type="text" id="prodName" list="existingProducts" placeholder="Escribe el producto...">
            <datalist id="existingProducts"></datalist>
        </div>

        <div class="form-group">
            <label>Supermercado / Tienda</label>
            <div class="store-grid" id="storeGrid"></div>
            <div id="customStoreBox" class="custom-store-box">
                <input type="text" id="customStoreName" list="existingStores" placeholder="Nombre de la tienda (ej. Frutería, Bonpreu...)">
                <button type="button" class="btn-clear-input" onclick="clearCustomStore()" title="Limpiar tienda">×</button>
                <datalist id="existingStores"></datalist>
            </div>
        </div>

        <div class="form-group">
            <label for="prodPrice">Precio (€) <span style="font-weight: normal; font-size: 14px; color: #64748b;">(opcional si solo va a la lista)</span></label>
            <input type="number" id="prodPrice" step="0.01" inputmode="decimal" placeholder="Ej. 2.45">
        </div>

        <button class="btn-main" onclick="savePrice()">💾 Guardar Precio</button>
        <button type="button" class="btn-secondary-add" onclick="addDirectlyFromAnotarToList()">🛒 Solo añadir a la Lista (sin precio todavía)</button>
        <div id="feedbackBox" class="feedback-box"></div>
    </div>

    <div id="sec-comparar" class="section">
        <div class="form-group">
            <input type="text" id="searchComp" placeholder="🔍 Buscar producto guardado..." oninput="renderComparator()">
        </div>

        <div id="comparatorContainer"></div>

        <div class="backup-box">
            <input type="file" id="tsvFileInput" accept=".txt,.tsv,.csv" style="display: none;" onchange="handleTSVUpload(event)">
            <button class="btn-import-tsv" onclick="document.getElementById('tsvFileInput').click()">📂 Importar TXT (Tabuladores)</button>
            <div class="format-hint">Formato por línea: Producto [TAB] Tienda [TAB] Precio</div>
            
            <div class="backup-row" style="margin-top: 6px;">
                <button class="btn-sec" onclick="exportData()">📤 Copiar Backup</button>
                <button class="btn-sec" onclick="importData()">📥 Restaurar Backup</button>
            </div>
        </div>
    </div>

    <div id="sec-lista" class="section">
        <div class="list-add-bar">
            <input type="text" id="listInput" list="existingProducts" placeholder="Añadir a la lista (con o sin precio)..." onkeypress="if(event.key==='Enter') addToShoppingList()">
            <button class="btn-main" style="width: auto; margin-top: 0; padding: 0 20px;" onclick="addToShoppingList()">+</button>
        </div>

        <div class="filter-pills" id="storeFilters"></div>

        <div id="shoppingListContainer"></div>

        <div class="total-banner">
            <div class="total-main-row">
                <span>Total estimado:</span>
                <span id="totalEstimated">0,00 €</span>
            </div>
            <div id="savingsNote" class="savings-note"></div>
        </div>

        <button class="btn-clear" onclick="clearDoneItems()">🗑️ Borrar productos tachados</button>
    </div>
</div>

<!-- Modal integrado para asignar precio desde la lista de la compra -->
<div id="quickPriceModal" class="modal-overlay" onclick="if(event.target===this) closeQuickPriceModal()">
    <div class="modal-card">
        <div class="modal-title" id="modalProdTitle">💶 Poner Precio</div>
        <div class="form-group">
            <label for="modalStoreSelect">¿En qué tienda estás?</label>
            <select id="modalStoreSelect"></select>
        </div>
        <div class="form-group" style="margin-bottom: 0;">
            <label for="modalPriceInput">Precio que marca (€)</label>
            <input type="number" id="modalPriceInput" step="0.01" inputmode="decimal" placeholder="Ej. 2.95" onkeypress="if(event.key==='Enter') confirmQuickPrice()">
        </div>
        <div class="modal-actions">
            <button type="button" class="btn-modal-cancel" onclick="closeQuickPriceModal()">Cancelar</button>
            <button type="button" class="btn-modal-save" onclick="confirmQuickPrice()">Guardar</button>
        </div>
    </div>
</div>

<script>
    const DEFAULT_STORES = ['Mercadona', 'Lidl', 'Aldi', 'Caprabo'];
    let preciosDB = JSON.parse(localStorage.getItem('jose_super_precios')) || {};
    let shoppingList = JSON.parse(localStorage.getItem('jose_super_lista')) || [];
    let customStores = JSON.parse(localStorage.getItem('jose_super_tiendas_custom')) || [];
    let selectedStore = 'Mercadona';
    let currentFilter = 'Todos';
    let modalTargetProduct = '';

    function syncCustomStoresFromDB() {
        let changed = false;
        Object.values(preciosDB).forEach(prod => {
            Object.keys(prod.prices).forEach(st => {
                if (!DEFAULT_STORES.includes(st) && !customStores.includes(st)) {
                    customStores.push(st);
                    changed = true;
                }
            });
        });
        if (changed) {
            localStorage.setItem('jose_super_tiendas_custom', JSON.stringify(customStores));
        }
    }

    function saveData() {
        localStorage.setItem('jose_super_precios', JSON.stringify(preciosDB));
        localStorage.setItem('jose_super_lista', JSON.stringify(shoppingList));
        localStorage.setItem('jose_super_tiendas_custom', JSON.stringify(customStores));
        renderStoreGrid();
        updateDatalists();
        updateListCount();
    }

    function normalizeKey(str) {
        return str.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function formatStoreName(rawStore) {
        const clean = rawStore.trim();
        if (!clean) return null;
        const low = normalizeKey(clean);
        if (low === 'mercadona') return 'Mercadona';
        if (low === 'lidl') return 'Lidl';
        if (low === 'aldi') return 'Aldi';
        if (low === 'caprabo') return 'Caprabo';
        const existingCustom = customStores.find(c => normalizeKey(c) === low);
        if (existingCustom) return existingCustom;
        return clean.charAt(0).toUpperCase() + clean.slice(1);
    }

    function getStoreBgClass(store) {
        if (DEFAULT_STORES.includes(store)) return `bg-${store}`;
        if (store === 'Sin asignar') return 'bg-SinAsignar';
        return 'bg-Custom';
    }

    function getAllKnownStores() {
        const set = new Set([...DEFAULT_STORES, ...customStores]);
        Object.values(preciosDB).forEach(prod => {
            Object.keys(prod.prices).forEach(st => set.add(st));
        });
        const extras = Array.from(set).filter(s => !DEFAULT_STORES.includes(s));
        return [...DEFAULT_STORES, ...extras];
    }

    function renderStoreGrid() {
        const grid = document.getElementById('storeGrid');
        grid.innerHTML = '';

        DEFAULT_STORES.forEach(st => {
            const div = document.createElement('div');
            div.className = 'store-option' + (selectedStore === st ? ' selected' : '');
            div.dataset.store = st;
            div.textContent = st;
            div.onclick = () => selectStore(st);
            grid.appendChild(div);
        });

        customStores.forEach(st => {
            const div = document.createElement('div');
            div.className = 'store-option' + (selectedStore === st ? ' selected' : '');
            div.dataset.store = st;
            div.dataset.type = 'custom';
            div.textContent = st;
            div.onclick = () => selectStore(st);

            const delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.className = 'btn-remove-store';
            delBtn.textContent = '×';
            delBtn.title = `Eliminar ${st}`;
            delBtn.onclick = (e) => {
                e.stopPropagation();
                removeCustomStore(st);
            };
            div.appendChild(delBtn);
            grid.appendChild(div);
        });

        const addBtn = document.createElement('div');
        addBtn.className = 'store-option full-row' + (selectedStore === 'Otra' ? ' selected' : '');
        addBtn.dataset.store = 'Otra';
        addBtn.textContent = '➕ Añadir nueva tienda';
        addBtn.onclick = () => selectStore('Otra');
        grid.appendChild(addBtn);
    }

    function removeCustomStore(storeName) {
        let affectedCount = 0;
        Object.values(preciosDB).forEach(prod => {
            if (prod.prices && prod.prices[storeName]) {
                affectedCount++;
            }
        });

        const warningMsg = affectedCount > 0
            ? `¿Seguro que quieres eliminar de verdad la tienda "${storeName}"?\n\n⚠️ Se borrarán también los ${affectedCount} ${affectedCount === 1 ? 'precio registrado' : 'precios registrados'} en esta tienda.`
            : `¿Seguro que quieres eliminar de verdad la tienda "${storeName}"?`;

        if (!confirm(warningMsg)) return;

        customStores = customStores.filter(s => s !== storeName);

        Object.keys(preciosDB).forEach(key => {
            if (preciosDB[key].prices && preciosDB[key].prices[storeName]) {
                delete preciosDB[key].prices[storeName];
                if (Object.keys(preciosDB[key].prices).length === 0) {
                    delete preciosDB[key];
                }
            }
        });

        if (selectedStore === storeName) {
            selectedStore = 'Mercadona';
        }
        if (currentFilter === storeName) {
            currentFilter = 'Todos';
        }

        saveData();
        renderComparator();
        renderFilterPills();
        renderShoppingList();
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));

        if (tab === 'anotar') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('sec-anotar').classList.add('active');
            renderStoreGrid();
        } else if (tab === 'comparar') {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('sec-comparar').classList.add('active');
            renderComparator();
        } else {
            document.querySelectorAll('.tab-btn')[2].classList.add('active');
            document.getElementById('sec-lista').classList.add('active');
            renderFilterPills();
            renderShoppingList();
        }
    }

    function selectStore(store) {
        selectedStore = store;
        renderStoreGrid();
        const customBox = document.getElementById('customStoreBox');
        if (store === 'Otra') {
            customBox.style.display = 'flex';
            const input = document.getElementById('customStoreName');
            input.value = '';
            input.focus();
        } else {
            customBox.style.display = 'none';
        }
    }

    function clearCustomStore() {
        const input = document.getElementById('customStoreName');
        input.value = '';
        input.focus();
    }

    function addDirectlyFromAnotarToList() {
        const rawName = document.getElementById('prodName').value.trim().toUpperCase();
        if (!rawName) {
            alert('Escribe primero el nombre del producto (por ejemplo: ARÁNDANOS).');
            return;
        }
        const added = insertProductIfUnique(rawName, false);
        if (added) {
            const fb = document.getElementById('feedbackBox');
            fb.style.display = 'block';
            fb.className = 'feedback-box feedback-good';
            fb.textContent = `🛒 "${rawName}" añadido a tu lista (sin precio todavía).`;
            document.getElementById('prodName').value = '';
            document.getElementById('prodPrice').value = '';
        }
    }

    function savePrice() {
        const rawName = document.getElementById('prodName').value.trim().toUpperCase();
        const priceVal = parseFloat(document.getElementById('prodPrice').value);

        let finalStore = selectedStore;
        if (selectedStore === 'Otra') {
            const customInput = document.getElementById('customStoreName').value.trim();
            if (!customInput) {
                alert('Por favor, escribe el nombre de la nueva tienda.');
                return;
            }
            finalStore = formatStoreName(customInput);
            if (!DEFAULT_STORES.includes(finalStore) && !customStores.includes(finalStore)) {
                customStores.push(finalStore);
            }
            selectedStore = finalStore;
            document.getElementById('customStoreBox').style.display = 'none';
            document.getElementById('customStoreName').value = '';
        }

        if (!rawName) {
            alert('Por favor, escribe el nombre del producto.');
            return;
        }

        if (isNaN(priceVal) || priceVal <= 0) {
            alert('Si todavía no sabes el precio, pulsa el botón de abajo "Solo añadir a la Lista". Si lo sabes, escribe un precio válido.');
            return;
        }

        const key = normalizeKey(rawName);
        const todayStr = new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });

        let prevBest = null;
        if (preciosDB[key]) {
            const entries = Object.entries(preciosDB[key].prices);
            if (entries.length > 0) {
                entries.sort((a, b) => a[1].price - b[1].price);
                prevBest = { store: entries[0][0], price: entries[0][1].price };
            }
        } else {
            preciosDB[key] = { displayName: rawName, prices: {} };
        }

        preciosDB[key].displayName = rawName;
        preciosDB[key].prices[finalStore] = { price: priceVal, date: todayStr };
        saveData();

        const fb = document.getElementById('feedbackBox');
        fb.style.display = 'block';

        if (!prevBest) {
            fb.className = 'feedback-box feedback-good';
            fb.textContent = `✅ Guardado: ${rawName} a ${priceVal.toFixed(2)} € en ${finalStore}.`;
        } else if (priceVal < prevBest.price) {
            const diff = (prevBest.price - priceVal).toFixed(2);
            fb.className = 'feedback-box feedback-good';
            fb.textContent = `🏆 ¡Nuevo mejor precio! Ahorras ${diff} € respecto a ${prevBest.store} (${prevBest.price.toFixed(2)} €).`;
        } else if (priceVal > prevBest.price && prevBest.store !== finalStore) {
            const diff = (priceVal - prevBest.price).toFixed(2);
            fb.className = 'feedback-box feedback-warn';
            fb.textContent = `⚠️ Guardado, pero en ${prevBest.store} lo tienes ${diff} € más barato (${prevBest.price.toFixed(2)} €).`;
        } else {
            fb.className = 'feedback-box feedback-good';
            fb.textContent = `✅ Precio actualizado en ${finalStore}: ${priceVal.toFixed(2)} €.`;
        }

        document.getElementById('prodName').value = '';
        document.getElementById('prodPrice').value = '';
    }

    function handleTSVUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const text = e.target.result;
            const lines = text.split(/\r?\n/);
            const todayStr = new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });
            let importedCount = 0;
            let skippedLines = [];

            lines.forEach((line, index) => {
                if (!line.trim()) return;
                const parts = line.split('\t');
                if (parts.length < 3) {
                    skippedLines.push(`Línea ${index + 1}: faltan columnas`);
                    return;
                }

                const rawProd = parts[0].trim().toUpperCase();
                const validStore = formatStoreName(parts[1]);
                const rawPrice = parts[2].trim().replace('€', '').replace(',', '.').trim();
                const priceVal = parseFloat(rawPrice);

                if (index === 0 && isNaN(priceVal)) return;

                if (!rawProd || !validStore || isNaN(priceVal) || priceVal <= 0) {
                    skippedLines.push(`Línea ${index + 1} (${rawProd || 'sin nombre'}): tienda o precio no válido`);
                    return;
                }

                if (!DEFAULT_STORES.includes(validStore) && !customStores.includes(validStore)) {
                    customStores.push(validStore);
                }

                const key = normalizeKey(rawProd);
                if (!preciosDB[key]) {
                    preciosDB[key] = { displayName: rawProd, prices: {} };
                } else {
                    preciosDB[key].displayName = rawProd;
                }

                preciosDB[key].prices[validStore] = { price: priceVal, date: todayStr };
                importedCount++;
            });

            saveData();
            renderComparator();
            event.target.value = '';

            let msg = `✅ Se han actualizado/añadido ${importedCount} precios correctamente.`;
            if (skippedLines.length > 0) {
                msg += `\n\n⚠️ Líneas ignoradas (${skippedLines.length}):\n` + skippedLines.slice(0, 5).join('\n');
            }
            alert(msg);
        };

        reader.readAsText(file, 'UTF-8');
    }

    function updateDatalists() {
        const dlProd = document.getElementById('existingProducts');
        dlProd.innerHTML = '';
        Object.values(preciosDB).forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.displayName.toUpperCase();
            dlProd.appendChild(opt);
        });

        const dlStores = document.getElementById('existingStores');
        dlStores.innerHTML = '';
        customStores.forEach(st => {
            const opt = document.createElement('option');
            opt.value = st;
            dlStores.appendChild(opt);
        });
    }

    function renderComparator() {
        const container = document.getElementById('comparatorContainer');
        const filterText = normalizeKey(document.getElementById('searchComp').value);
        container.innerHTML = '';

        const keys = Object.keys(preciosDB).filter(k => k.includes(filterText)).sort();

        if (keys.length === 0) {
            container.innerHTML = '<div class="empty-msg">No hay productos guardados que coincidan. ¡Empieza anotando precios o importa un archivo TXT!</div>';
            return;
        }

        keys.forEach(key => {
            const prod = preciosDB[key];
            const storeEntries = Object.entries(prod.prices).sort((a, b) => a[1].price - b[1].price);
            if (storeEntries.length === 0) return;

            const card = document.createElement('div');
            card.className = 'comp-card';

            let rowsHtml = '';
            storeEntries.forEach(([store, info], idx) => {
                const isBest = idx === 0;
                const badgeClass = getStoreBgClass(store);
                const safeStore = store.replace(/'/g, "\\'");
                rowsHtml += `
                    <div class="price-row ${isBest ? 'cheapest' : ''}">
                        <div>
                            <span class="store-badge ${badgeClass}">${store}</span>
                            ${isBest && storeEntries.length > 1 ? ' 🏆' : ''}
                        </div>
                        <div class="price-meta">
                            <span class="date-tag">(${info.date})</span>
                            <span>${info.price.toFixed(2)} €</span>
                            <button class="btn-icon-tiny" onclick="editStorePrice('${key}', '${safeStore}')" title="Editar precio">✏️</button>
                            <button class="btn-del-tiny" onclick="deleteStorePrice('${key}', '${safeStore}')" title="Borrar precio">×</button>
                        </div>
                    </div>
                `;
            });

            const upperName = prod.displayName.toUpperCase();
            card.innerHTML = `
                <div class="comp-header">
                    <div class="comp-title-wrap">
                        <span class="comp-title">🧺 ${upperName}</span>
                        <button class="btn-edit-name" onclick="editProductName('${key}')" title="Cambiar nombre del producto">✏️</button>
                    </div>
                    <button class="btn-add-list-mini" onclick="quickAddToList('${upperName.replace(/'/g, "\\'")}')">+ Lista</button>
                </div>
                ${rowsHtml}
            `;
            container.appendChild(card);
        });
    }

    function editProductName(oldKey) {
        if (!preciosDB[oldKey]) return;
        const oldName = preciosDB[oldKey].displayName.toUpperCase();

        const input = prompt('Nuevo nombre para este producto:', oldName);
        if (input === null) return;

        const newName = input.trim().toUpperCase();
        if (!newName) {
            alert('El nombre del producto no puede quedar vacío.');
            return;
        }
        if (newName === oldName) return;

        const newKey = normalizeKey(newName);

        if (newKey === oldKey) {
            preciosDB[oldKey].displayName = newName;
        } else if (preciosDB[newKey]) {
            if (!confirm(`Ya existe un producto llamado "${preciosDB[newKey].displayName.toUpperCase()}".\n\n¿Quieres fusionar ambos productos y juntar todos sus precios?`)) {
                return;
            }
            preciosDB[newKey].displayName = newName;
            Object.assign(preciosDB[newKey].prices, preciosDB[oldKey].prices);
            delete preciosDB[oldKey];
        } else {
            preciosDB[newKey] = {
                displayName: newName,
                prices: preciosDB[oldKey].prices
            };
            delete preciosDB[oldKey];
        }

        shoppingList.forEach(item => {
            if (normalizeKey(item.name) === oldKey) {
                item.name = newName;
            }
        });

        saveData();
        renderComparator();
    }

    function editStorePrice(key, store) {
        if (!preciosDB[key] || !preciosDB[key].prices[store]) return;
        const currentPrice = preciosDB[key].prices[store].price;
        const prodName = preciosDB[key].displayName.toUpperCase();

        const input = prompt(`Nuevo precio (€) para "${prodName}" en ${store}:`, currentPrice.toFixed(2));
        if (input === null) return;

        const newPrice = parseFloat(input.replace(',', '.').trim());
        if (isNaN(newPrice) || newPrice <= 0) {
            alert('Por favor, introduce un precio válido mayor que 0.');
            return;
        }

        const todayStr = new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });
        preciosDB[key].prices[store] = { price: newPrice, date: todayStr };
        saveData();
        renderComparator();
    }

    function deleteStorePrice(key, store) {
        if (confirm(`¿Borrar el precio de ${store} para este producto?`)) {
            delete preciosDB[key].prices[store];
            if (Object.keys(preciosDB[key].prices).length === 0) {
                delete preciosDB[key];
            }
            saveData();
            renderComparator();
        }
    }

    function insertProductIfUnique(rawName, showAddedAlert) {
        const upper = rawName.trim().toUpperCase();
        if (!upper) return false;

        const key = normalizeKey(upper);
        const existingIdx = shoppingList.findIndex(item => normalizeKey(item.name) === key);

        if (existingIdx > -1) {
            const existingItem = shoppingList[existingIdx];
            if (!existingItem.done) {
                alert(`⚠️ "${upper}" ya lo tienes apuntado en tu lista de la compra.`);
                return false;
            } else {
                if (confirm(`"${upper}" ya está en tu lista pero marcado como comprado (tachado).\n\n¿Quieres volver a activarlo en la lista?`)) {
                    shoppingList[existingIdx].done = false;
                    saveData();
                    return true;
                }
                return false;
            }
        }

        shoppingList.unshift({ id: Date.now().toString(), name: upper, done: false });
        saveData();
        if (showAddedAlert) {
            alert(`✅ "${upper}" añadido a tu lista de la compra.`);
        }
        return true;
    }

    function quickAddToList(name) {
        insertProductIfUnique(name, true);
    }

    function addToShoppingList() {
        const input = document.getElementById('listInput');
        const val = input.value.trim();
        if (!val) return;

        const added = insertProductIfUnique(val, false);
        if (added) {
            input.value = '';
            renderShoppingList();
        } else {
            input.select();
        }
    }

    /* Funciones para el modal rápido de poner precio desde la lista */
    function openQuickPriceModal(prodName) {
        modalTargetProduct = prodName.toUpperCase();
        document.getElementById('modalProdTitle').textContent = `💶 ${modalTargetProduct}`;

        const select = document.getElementById('modalStoreSelect');
        select.innerHTML = '';
        const stores = getAllKnownStores();
        stores.forEach(st => {
            const opt = document.createElement('option');
            opt.value = st;
            opt.textContent = st;
            if (currentFilter !== 'Todos' && currentFilter === st) {
                opt.selected = true;
            }
            select.appendChild(opt);
        });

        const priceInput = document.getElementById('modalPriceInput');
        priceInput.value = '';
        document.getElementById('quickPriceModal').style.display = 'flex';
        setTimeout(() => priceInput.focus(), 50);
    }

    function closeQuickPriceModal() {
        document.getElementById('quickPriceModal').style.display = 'none';
        modalTargetProduct = '';
    }

    function confirmQuickPrice() {
        const store = document.getElementById('modalStoreSelect').value;
        const rawPrice = document.getElementById('modalPriceInput').value.replace(',', '.').trim();
        const priceVal = parseFloat(rawPrice);

        if (!modalTargetProduct || !store || isNaN(priceVal) || priceVal <= 0) {
            alert('Introduce un precio válido mayor que 0.');
            return;
        }

        const key = normalizeKey(modalTargetProduct);
        const todayStr = new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });

        if (!preciosDB[key]) {
            preciosDB[key] = { displayName: modalTargetProduct, prices: {} };
        }
        preciosDB[key].displayName = modalTargetProduct;
        preciosDB[key].prices[store] = { price: priceVal, date: todayStr };

        saveData();
        closeQuickPriceModal();
        renderShoppingList();
    }

    function renderFilterPills() {
        const container = document.getElementById('storeFilters');
        const stores = ['Todos', ...getAllKnownStores()];
        if (!stores.includes(currentFilter)) currentFilter = 'Todos';

        container.innerHTML = '';
        stores.forEach(st => {
            const btn = document.createElement('button');
            btn.className = 'pill' + (currentFilter === st ? ' active' : '');
            btn.textContent = st;
            btn.onclick = () => setFilter(st);
            container.appendChild(btn);
        });
    }

    function setFilter(store) {
        currentFilter = store;
        renderFilterPills();
        renderShoppingList();
    }

    function getBestOptionForProduct(name) {
        const key = normalizeKey(name);
        if (!preciosDB[key]) return { store: 'Sin asignar', price: null };
        const entries = Object.entries(preciosDB[key].prices).sort((a, b) => a[1].price - b[1].price);
        if (entries.length === 0) return { store: 'Sin asignar', price: null };
        return { store: entries[0][0], price: entries[0][1].price };
    }

    function calculateTotalSavings() {
        let totalDiff = 0;

        shoppingList.forEach(item => {
            if (currentFilter !== 'Todos') {
                const best = getBestOptionForProduct(item.name);
                if (best.store !== currentFilter) return;
            }

            const key = normalizeKey(item.name);
            if (preciosDB[key]) {
                const prices = Object.values(preciosDB[key].prices).map(p => p.price);
                if (prices.length >= 2) {
                    const maxPrice = Math.max(...prices);
                    const minPrice = Math.min(...prices);
                    totalDiff += (maxPrice - minPrice);
                }
            }
        });

        return totalDiff;
    }

    function renderShoppingList() {
        const container = document.getElementById('shoppingListContainer');
        const savingsEl = document.getElementById('savingsNote');
        container.innerHTML = '';
        savingsEl.style.display = 'none';

        if (shoppingList.length === 0) {
            container.innerHTML = '<div class="empty-msg">Tu lista está vacía. Añade productos arriba (aunque no sepas el precio) o desde Productos.</div>';
            document.getElementById('totalEstimated').textContent = '0,00 €';
            return;
        }

        const storesOrder = [...getAllKnownStores(), 'Sin asignar'];
        const groups = {};
        storesOrder.forEach(s => groups[s] = []);

        let grandTotal = 0;

        shoppingList.forEach(item => {
            const best = getBestOptionForProduct(item.name);
            if (!groups[best.store]) groups[best.store] = [];
            groups[best.store].push({ ...item, bestPrice: best.price, bestStore: best.store });
            if (best.price !== null && (currentFilter === 'Todos' || currentFilter === best.store)) {
                grandTotal += best.price;
            }
        });

        storesOrder.forEach(storeName => {
            if (currentFilter !== 'Todos' && currentFilter !== storeName) return;
            const itemsInStore = groups[storeName];
            if (!itemsInStore || itemsInStore.length === 0) return;

            itemsInStore.sort((a, b) => a.done - b.done);

            let subtotal = 0;
            itemsInStore.forEach(i => { if (i.bestPrice) subtotal += i.bestPrice; });

            const header = document.createElement('div');
            const bgClass = getStoreBgClass(storeName);
            header.className = `store-group-title ${bgClass}`;
            header.innerHTML = `
                <span>${storeName === 'Sin asignar' ? '❓ Sin precio registrado' : '🏪 ' + storeName}</span>
                <span>${subtotal > 0 ? subtotal.toFixed(2) + ' €' : ''}</span>
            `;
            container.appendChild(header);

            itemsInStore.forEach(item => {
                const row = document.createElement('div');
                row.className = `shop-item ${item.done ? 'done' : ''}`;
                const upperName = item.name.toUpperCase();
                const safeName = upperName.replace(/'/g, "\\'");

                const priceActionHtml = item.bestPrice !== null
                    ? `<span class="shop-price-tag">${item.bestPrice.toFixed(2)} €</span><button type="button" class="btn-add-price-plus" onclick="event.stopPropagation(); openQuickPriceModal('${safeName}')" title="Añadir precio en otra tienda">+€</button>`
                    : `<button type="button" class="btn-set-price" onclick="event.stopPropagation(); openQuickPriceModal('${safeName}')">💶 Poner €</button>`;

                row.innerHTML = `
                    <div class="check-box" onclick="toggleShopItem('${item.id}')"></div>
                    <div class="shop-info" onclick="toggleShopItem('${item.id}')">${upperName}</div>
                    ${priceActionHtml}
                    <button type="button" class="btn-del-tiny" onclick="event.stopPropagation(); deleteShopItem('${item.id}')">×</button>
                `;
                container.appendChild(row);
            });
        });

        document.getElementById('totalEstimated').textContent = grandTotal.toFixed(2).replace('.', ',') + ' €';

        const totalSavings = calculateTotalSavings();
        if (totalSavings > 0.005) {
            const savedStr = totalSavings.toFixed(2).replace('.', ',');
            savingsEl.style.display = 'block';
            savingsEl.innerHTML = `💰 Haciendo la compra con la lista actual te ahorras: <strong>${savedStr} €</strong>`;
        }
    }

    function toggleShopItem(id) {
        const idx = shoppingList.findIndex(i => i.id === id);
        if (idx > -1) {
            shoppingList[idx].done = !shoppingList[idx].done;
            saveData();
            renderShoppingList();
        }
    }

    function deleteShopItem(id) {
        shoppingList = shoppingList.filter(i => i.id !== id);
        saveData();
        renderShoppingList();
    }

    function clearDoneItems() {
        const remaining = shoppingList.filter(i => !i.done);
        if (remaining.length === shoppingList.length) {
            alert('No hay productos tachados para borrar.');
            return;
        }
        if (confirm('¿Borrar los productos ya tachados de la lista?')) {
            shoppingList = remaining;
            saveData();
            renderShoppingList();
        }
    }

    function updateListCount() {
        const pending = shoppingList.filter(i => !i.done).length;
        document.getElementById('listCount').textContent = pending;
    }

    function exportData() {
        const backup = JSON.stringify({ preciosDB, shoppingList, customStores });
        navigator.clipboard.writeText(backup).then(() => {
            alert('✅ Copia de seguridad copiada al portapapeles. Pégala en una nota de tu iPhone para guardarla.');
        }).catch(() => {
            prompt('Copia este texto manualmente para guardar tus datos:', backup);
        });
    }

    function importData() {
        const raw = prompt('Pega aquí el texto de tu copia de seguridad:');
        if (!raw) return;
        try {
            const parsed = JSON.parse(raw);
            if (parsed.preciosDB) {
                preciosDB = parsed.preciosDB;
                shoppingList = parsed.shoppingList || [];
                customStores = parsed.customStores || [];
                syncCustomStoresFromDB();
                saveData();
                renderComparator();
                renderFilterPills();
                alert('✅ Datos restaurados correctamente.');
            } else {
                alert('El formato del texto no es válido.');
            }
        } catch (e) {
            alert('Error al leer los datos. Asegúrate de copiar el texto completo.');
        }
    }

    window.onload = () => {
        syncCustomStoresFromDB();
        renderStoreGrid();
        updateDatalists();
        updateListCount();
        renderFilterPills();
    };
</script>
